name: calvin

services:
  calvin-lab:
    build: .
    image: calvin:dev
    entrypoint: ["calvin-lab"]
    # Ayarların hepsi flag'dir; çalışırken POST /api/settings ile de değişir.
    command:
      - -replicas=3
      - -partitions=4
      - -mode=paxos
      - -net=1ms
      - -workload=mixed
      - -clients=128
      - -mp=0.1
      - -ci=0.01
      - -checkpoint-every=15s
      - -verify-every=20s
      - -checkpoint-dir=/data/checkpoints
      - -log-file=/logs/calvin.log
    ports:
      - "2112:2112"
    volumes:
      - ./deploy/logs:/logs
      - calvin-data:/data
    user: root # bind mount'lu log dizinine yazabilmek için
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./deploy/logs:/logs:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/calvin.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  calvin-data:
  prometheus-data:
  loki-data:
  grafana-data:
